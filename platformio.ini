; Smart Plant Monitoring System - ESP32 DevKit V1 (ESP-WROOM-32)
; Framework: ESP-IDF only (Arduino is prohibited by the project brief)
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall
    -Wextra

; Host-native unit tests for hardware-independent logic: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    -Wall
    -Wextra
    -Icomponents/monitoring/include
    -Icomponents/monitoring/src